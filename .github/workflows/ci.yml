name: CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Run unit tests
        run: |
          PYTHONPATH=backend pytest backend/tests -v


  build:
    name: Build and Push Docker Image
    runs-on: self-hosted
    environment: test
    needs: unit-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            codeykenny/github-actions-learn-2:latest
            codeykenny/github-actions-learn-2:${{ github.sha }}
            codeykenny/github-actions-learn-2:${{ github.run_number }}


  update-gitops:
    name: Update GitOps Repository
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: sujanpakhrin/learning-k8s
          token: ${{ secrets.GITOPS }}
          path: learning-k8s

      - name: Update Flask image
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("learning-k8s/03-helm/flask-app/values.yaml")
          content = path.read_text()

          content, repo_count = re.subn(
              r'(?s)(app:\s+replicaCount:.*?image:\s+repository:)\s*\S+',
              r'\1 codeykenny/github-actions-learn-2',
              content,
              count=1
          )

          content, tag_count = re.subn(
              r'(?s)(app:\s+replicaCount:.*?image:\s+repository:.*?\n\s+tag:)\s*"[^"]+"',
              r'\1 "${{ github.sha }}"',
              content,
              count=1
          )

          if repo_count != 1 or tag_count != 1:
              raise SystemExit(
                  f"Could not update Flask image: repository={repo_count}, tag={tag_count}"
              )

          path.write_text(content)
          PY

      - name: Commit and push GitOps change
        run: |
          cd learning-k8s

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add 03-helm/flask-app/values.yaml

          git commit -m "chore: update flask app image to ${{ github.sha }}" || echo "No changes to commit"

          git push